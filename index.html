<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oryzene Esports — Current Scrim</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <img src="assets/oryzene1.png" alt="Oryzene Esports Logo">
  <h1>ORYZENE ESPORTS</h1>
  <p>Community-driven Esports Organization</p>
</header>

<nav>
  <a href="landing.html">Home</a>
  <a href="index.html">Scrims</a>
  <a href="past-scrims.html">Past Scrims</a>
  <a href="community.html">Community</a>
  <a href="players.html">Players</a>
  <a href="sponsors.html">Sponsors</a>
  <a href="admin.html">Admin</a>
</nav>

<section>
  <h2>Current Scrim</h2>
  <div class="card" id="current-scrim">
    <p class="small muted">Loading current scrim...</p>
  </div>

  <h2>Contact & Registration</h2>
  <div class="card">
    <p>📱 WhatsApp: <b>6387772010</b></p>
    <p>📧 Email: <b>oryzeneesports@gmail.com</b></p>
    <a class="btn" href="https://wa.me/916387772010">DM on WhatsApp</a>
  </div>
</section>

<footer>
  © 2026 Oryzene Esports | All Rights Reserved
</footer>

<script>
async function loadScrim(){
  const el = document.getElementById('current-scrim');
  try{
    const res = await fetch('/api/scrims');
    const data = await res.json();
    const current = data.filter(s=>!s.completed).sort((a,b)=>b.id-a.id)[0];
    if(!current){ el.innerHTML = '<p>No active scrims at the moment.</p>'; return }
    el.innerHTML = `
      <div class="row">
        <div style="flex:1">
          <img src="${current.poster||'assets/poster_ffmax.jpg'}" class="poster" alt="poster">
        </div>
        <div style="flex:1">
          <p><b>Game:</b> ${current.game}</p>
          <p><b>Entry:</b> ₹${current.entry} per team</p>
          <p><b>Prize:</b> ${current.prize}</p>
          <p><b>Date:</b> ${current.date}</p>
          <a class="btn" href="https://wa.me/916387772010">Register via WhatsApp</a>
        </div>
      </div>
    `;
  }catch(e){ el.innerHTML = '<p class="muted">Failed to load scrim.</p>' }
}
loadScrim();
</script>

</body>
</html>
